# Project policy template for kanban-implementation-workflow.
# Copy this into a repository policy file and replace every placeholder.
version: 1

tracker:
  kind: forgejo # forgejo, github, gitlab, bitbucket, or custom
  project: owner/repository
  adapter: tea # provider CLI/API/webhook adapter
  base_url: null # required for self-hosted or custom trackers
  dependency_source: body_marker # body_marker, native, or sub_issues when supported
  issue_labels:
    parked: parked
    epic: epic
  base_branch: dev

profiles:
  orchestrator: default
  implementer: implementer
  code_reviewer: reviewer # concrete profile name may remain reviewer
  completion_verifier: null # optional concrete profile name
  code_reviewer_model_default: null # e.g. provider/strong-model-id
  code_reviewer_model_routine: null # e.g. provider/routine-model-id
  implementer_vendor_family: null # null = unknown; review remains REVIEW-INCOMPLETE until independent
  code_reviewer_vendor_family: null # null = unknown; review remains REVIEW-INCOMPLETE until independent
  qa_ui: null # policy role key -> profile name
  release_operator: null # policy role key -> profile name

decision_authority:
  mode: delegated # delegated | approval_required
  default: smallest_adequate_policy_compliant
  delegated_scope:
    - backlog_admission
    - decomposition
    - ownership
    - sequencing
    - architecture
    - remediation
    - recovery
    - review_routing
    - dependency_resolution
    - artifact_publication
    - non_production_rollout
    - issue_state_progression
  non_delegable:
    - production_approval
    - destructive_or_irreversible_action_without_rollback
    - undefined_safety_critical_value
    - undefined_security_privacy_compliance_or_legal_risk
    - materially_contradictory_requirements
    - unavailable_capability_or_credential
    - material_unapproved_cost_customer_or_data_retention_impact
  required_decision_record:
    - decision
    - rationale
    - assumptions
    - owner
    - dependencies
    - acceptance_evidence
    - rollback_or_fallback
    - next_gate

operator_bridge:
  mode: central_transport_only
  enabled: true
  request_marker: OPERATOR_INPUT_REQUIRED
  response_marker: DECISION
  dedupe_on: [source_item, change_request, kanban_task, evidence_fingerprint]

kanban:
  auto_decompose: true
  auto_decompose_per_tick: 3
  max_in_progress: 8 # total cap; tune for aggregate backend capacity
  max_in_progress_per_profile: 2 # conservative start; raise after a capacity probe
  dispatcher_owner: supervised_gateway # the shared factory supports only the supervised gateway owner
  review_dispatch: false

verification:
  headless:
    - cargo test
    - pnpm --filter app test
    - pnpm --filter app build
    - pnpm --filter app lint
  ui_smoke: null
  required_for_ui_changes: false # set true only when ui_smoke is configured
  process_cleanup_required: true

review:
  required: true
  independent_vendor_family: true
  implementer_self_review_is_final: false

safety:
  protected_paths: []
  secrets_policy: key_env # key_env | vault | none-required
  forbidden_mutations: []

deployment:
  mode: unspecified # gitops_only | direct_allowed | release_only | unspecified
  # direct_cluster_mutation is a hard override; forbidden wins over any mode.
  controller: null  # argocd | flux | platform-release | null
  gitops_repository: null
  direct_cluster_mutation: forbidden

notifications:
  progress_digest_schedule: every 30m
  gateway_home_channel: null
